name: Deploy to infinityfree via FTP

on:
  push:
    branches:
      - main # Ubah ke branch utama kamu (contoh: master)di

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Sesuaikan dengan versi PHP di hosting kamu
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, dom, filter, gd, iconv, json, libxml, mbstring, openssl, pcre, phar, pdo, session, sqlite, xml, zip

      - name: 📦 Install Composer Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Sesuaikan dengan versi Node.js yang kamu pakai

      - name: 📦 Install NPM Dependencies & Build
        run: |
          npm install
          npm run build

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftpupload.net
          username: if0_42761058
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /Home/htdocs/ # Sesuaikan jika kamu menyimpannya di subfolder atau direktori lain (harus diakhiri garis miring)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            .env.example
            README.md
            phpunit.xml
            .editorconfig
