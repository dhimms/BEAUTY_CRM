services:

  # ─── PHP-FPM (Laravel App) ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: beauty_crm_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - PHP_OPCACHE_ENABLE=0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - beauty_network
    depends_on:
      - minio

  # ─── Nginx Web Server ─────────────────────────────────────────────────────
  nginx: 
    image: nginx:1.25-alpine
    container_name: beauty_crm_nginx
    restart: unless-stopped
    ports:
      - "8080:80" 
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - beauty_network
    depends_on:
      - app

  # ─── MinIO (S3-compatible Storage) ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: beauty_crm_minio
    restart: unless-stopped
    ports:
      - "9010:9000"   # API Port
      - "9011:9001"   # Web Console Dashboard
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - beauty_network

  # ─── MinIO Setup (Buat bucket otomatis) ──────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: beauty_crm_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5;
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/beauty-crm;
        mc anonymous set public local/beauty-crm;
        exit 0;
      "
    networks:
      - beauty_network

# ─── Named Volumes ───────────────────────────────────────────────────────────
volumes:
  minio_data:
    driver: local

# ─── Network ─────────────────────────────────────────────────────────────────
networks:
  beauty_network:
    driver: bridge
